name: Verify plugin candidate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run build:ui
      - run: npm test
      - run: npm run test:ui
      - run: npm run check
      - run: npm run distribution:test
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: Halftone-DTF-candidate
          path: dist/
  windows-updater:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse and exercise updater without installing or scheduling
        shell: powershell
        run: ./tests/windows-updater.tests.ps1
